apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx-storage
    hello: world
    from: code
  name: nginx-storage
spec:
  containers:
  - image: nginx
    name: nginx-storage
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    volumeMounts:
    - name: scratch
      mountPath: /scratch
  volumes:
  - name: scratch
    emptyDir: {}
  